[package]
name = "sift"
version = "1.1.0"
description = "See how much space you can safely get back."
authors = ["Timothy Murphy"]
repository = "https://github.com/idevtim/sift"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sift_lib"

[[bin]]
name = "Sift"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Weekly check-up notification (runs without the Tauri runtime)
notify-rust = "4.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Scanning
walkdir = "2"
rayon = "1"
sysinfo = "0.32"
dirs = "5"

# Restore holding area
uuid = { version = "1", features = ["v4"] }

# Duplicate detection
blake3 = "1"
# App icons as data URLs
base64 = "0.22"

# Apps (macOS): read Info.plist, parse Spotlight last-used dates
plist = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# Recycle Bin size and emptying
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
